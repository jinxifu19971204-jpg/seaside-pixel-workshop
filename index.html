body.access-locked { overflow-x: hidden; }
.access-gate {

  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 28px 20px;
  background: radial-gradient(ellipse at 10% 10%, #d8efe6 0, transparent 45%),

}
.access-card {
  width: min(100%, 420px);
  padding: 38px 32px 28px;
  border: 1px solid #e0e9e5;
  border-radius: 18px;
  background: #fff;

}

.access-brand .brand-mark { flex: 0 0 36px; width: 36px; height: 36px; }
.access-brand-copy { min-width: 0; }
.access-brand h1 { margin: 0; font-size: 21px; line-height: 1.4; letter-spacing: .02em; }
.access-brand p { margin: 4px 0 0; color: #87939a; font-size: 9px; letter-spacing: .12em; }
.access-card h2 { margin: 0 0 8px; font-size: 20px; line-height: 1.5; }
.access-intro { margin: 0 0 26px; color: #728087; font-size: 13px; line-height: 1.8; }
.access-label { display: block; margin-bottom: 9px; color: #43545a; font-size: 13px; font-weight: 600; }
.access-password-row { position: relative; }
#accessPassword {
  display: block;
  width: 100%;
  height: 48px;
  padding: 0 70px 0 14px;
  border: 1px solid #dce5e1;
  border-radius: 7px;
  color: #253138;
  background: #fbfcfc;
  font-size: 16px;
}
#accessPassword[aria-invalid="true"] { border-color: #cc554c; }
.access-show-password {
  position: absolute;
  top: 6px;
  right: 7px;
  height: 36px;
  padding: 0 10px;
  border: 0;
  border-radius: 5px;
  background: transparent;
  color: #4a806e;
  font-size: 12px;
  cursor: pointer;
}
.access-show-password:hover { background: #edf7f2; }
.access-error { min-height: 22px; margin: 9px 0 13px; color: #ba423a; font-size: 12px; line-height: 1.8; }
.access-submit {
  width: 100%;
  height: 46px;
  border: 0;
  border-radius: 7px;
  background: #35a987;
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.access-submit:hover { background: #2b9273; }
.access-submit:disabled { opacity: .65; cursor: wait; }
.access-footer { margin: 22px 0 0; color: #92a09f; font-size: 11px; line-height: 1.8; text-align: center; }
.access-noscript { max-width: 420px; margin: 20px auto; padding: 16px; color: #ba423a; text-align: center; }
@media (max-width: 420px) {
  .access-card { padding: 30px 22px 24px; }
  .access-brand h1 { font-size: 19px; }
}

  const form = document.querySelector('#accessForm');
  const input = document.querySelector('#accessPassword');
  const error = document.querySelector('#accessError');
  const submit = document.querySelector('#accessSubmit');
  const toggle = document.querySelector('#accessShowPassword');
  let busy = false;

  function fromBase64(value) {
    return Uint8Array.from(atob(value), character => character.charCodeAt(0));
  }

  toggle.addEventListener('click', () => {
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    toggle.textContent = show ? '隐藏' : '显示';
    toggle.setAttribute('aria-pressed', String(show));
    toggle.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
    input.focus();
  });

  input.addEventListener('input', () => {
    error.textContent = '';
    input.removeAttribute('aria-invalid');
  });

  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (busy) return;
    if (!input.value) {
      error.textContent = '请先输入访问密码。';
      input.setAttribute('aria-invalid', 'true');
      input.focus();
      return;
    }
    if (!globalThis.crypto?.subtle) {
      error.textContent = '当前浏览器不支持解密。请用新版 Edge 或 Chrome，通过 HTTPS 网页地址访问。';
      return;
    }

    busy = true;
    submit.disabled = true;
    toggle.disabled = true;
    input.disabled = true;
    submit.textContent = '正在解密，请稍候…';
    const passwordBytes = new TextEncoder().encode(input.value);
    try {
      const keyMaterial = await crypto.subtle.importKey(
        'raw', passwordBytes, 'PBKDF2', false, ['deriveKey']
      );
      const key = await crypto.subtle.deriveKey(
        {
          name: 'PBKDF2',
          hash: 'SHA-256',
          salt: fromBase64(ENCRYPTED_PAGE.salt),
          iterations: ENCRYPTED_PAGE.iterations
        },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
      const plaintext = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: fromBase64(ENCRYPTED_PAGE.iv), tagLength: 128 },
        key,
        fromBase64(ENCRYPTED_PAGE.ciphertext)
      );
      const workshopHtml = new TextDecoder('utf-8', { fatal: true }).decode(plaintext);
      input.value = '';
      // Replace the entry with the complete decrypted, self-contained app.
      // No key, password, or unlocked flag is written into browser storage.
      document.open();
      document.write(workshopHtml);
      document.close();
    } catch {
      error.textContent = '密码不正确，或页面文件已损坏，请重新输入。';
      input.setAttribute('aria-invalid', 'true');
      input.disabled = false;
      submit.disabled = false;
      toggle.disabled = false;
      submit.textContent = '解密并进入工坊 →';
      busy = false;
      input.focus();
      input.select();
    } finally {
      passwordBytes.fill(0);
    }
  });
})();
